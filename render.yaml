services:
  - type: web
    name: teacherai-ai-service
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r ai-service/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: ai-service
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SERVICE_SECRET
        generateValue: true
